[project]
name = "sondaje"
version = "0.1.0"
description = "Investigative case study of Romanian political pollsters, measured against election results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pdfplumber>=0.11.11",
    "pypdf>=7.1.1",
]

[project.scripts]
sondaje = "sondaje.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Docs are shared prose; keep the formatter from rewriting code blocks in them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["sondaje"]

[tool.ruff.format]
# .gitattributes normalizes committed files to LF; accept CRLF in Windows working trees.
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
